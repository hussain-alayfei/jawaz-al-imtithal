name: Digital Twin CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and pipeline tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Browser acceptance and screenshots
        run: node scripts/twin-visual-check.mjs
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-twin-captures
          path: artifacts/digital-twin/*.png
          if-no-files-found: warn
