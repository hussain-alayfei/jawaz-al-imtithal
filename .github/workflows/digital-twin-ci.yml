name: Digital Twin CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The browser check renders the 3D studio in software (no GPU on hosted runners): allow for it.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate branding across tracked files
        run: npm run brand:check
      - name: Unit and pipeline tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Browser acceptance and screenshots
        # Serves dist/client with vite preview and drives the preinstalled Google Chrome (SwiftShader WebGL).
        run: node scripts/twin-visual-check.mjs
        timeout-minutes: 30
        env:
          CHROME_PATH: /usr/bin/google-chrome
          TWIN_TIMEOUT: "180000"
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-twin-captures
          path: artifacts/digital-twin/*.png
          if-no-files-found: warn
